name: MLE CI

on:
  push:
    paths:
      - "mle/**"
      - ".github/workflows/mle-ci.yml"
  pull_request:
    paths:
      - "mle/**"
      - ".github/workflows/mle-ci.yml"

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mle

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mle/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest
