name: Sync daily market prices

on:
  schedule:
    # Weekdays 22:00 UTC ≈ after US equity market close
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mle/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync prices into DailyMarketPrice
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/sync_prices.py --period 5d
